name: C and C++ reference matrix
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: ubuntu-latest, target: i686-unknown-linux-gnu}
          - {os: macos-latest, target: arm64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, arch: x64}
          - {os: windows-2022, target: i686-pc-windows-msvc, arch: x86}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Install 32-bit system libraries
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - name: Execute native probes
        run: python3 scripts/reference.py --target ${{ matrix.target }} --std c++20 --std c++23 --native --out results/native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.target }}
          path: results/
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        llvm: [18, 19, 20, 21, 22, 23]
    steps:
      - uses: actions/checkout@v4
      - name: Install selected upstream Clang
        run: |
          wget --retry-connrefused --tries=3 -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}
      - name: Cross-target final-layout probes
        run: python3 scripts/reference.py --clang clang++-${{ matrix.llvm }} --out results/cross
      - name: Native upstream compiler probes
        if: always()
        run: python3 scripts/reference.py --clang clang++-${{ matrix.llvm }} --target x86_64-unknown-linux-gnu --native --out results/native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-${{ matrix.llvm }}
          path: results/
